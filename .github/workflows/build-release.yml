name: Build Windows artifact

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build one-file executable
        run: python -m PyInstaller --noconfirm --clean CodexConfigManager.spec
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CodexConfigManager.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CodexConfigManager.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexConfigManager-${{ github.ref_name }}
          path: |
            dist/CodexConfigManager.exe
            dist/SHA256SUMS.txt
